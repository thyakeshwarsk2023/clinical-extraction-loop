system:
  max_iterations: 2
  default_tolerance_epsilon: 0.10

assay_routes:
  friedewald:
    type: "deterministic_equality"
    formula: "total_cholesterol - (hdl + ldl + (triglycerides / 5.0))"
    tolerance: 0.10
    validity_bounds:
      triglycerides_min: 0.0
      triglycerides_max: 400.0
      abstain_label: "ABSTAIN_CLINICAL_ANOMALY"

  sampson:
    type: "bivariate_non_hdl"
    formula: "tc/1.19 + hdl/1.1 - tg/3.98 - (tg*(tc-hdl))/8.2 - 0.17"
    tolerance: 0.10
    validity_bounds:
      triglycerides_min: 400.0
      triglycerides_max: 800.0
      abstain_label: "ABSTAIN_TG800"

  martin_hopkins:
    type: "stratified_empirical_divisor"
    formula: "total_cholesterol - hdl - (triglycerides / f)"
    divisor_range: [3.1, 11.9]
    tolerance: 0.10

  direct_measured:
    type: "plausibility_bounds"
    rules:
      - "ldl < total_cholesterol"
      - "hdl < total_cholesterol"
      - "total_cholesterol > (hdl + ldl)"
      - "ldl >= 0.0"
      - "hdl >= 0.0"
      - "triglycerides >= 0.0"

  ambiguous_fallback:
    type: "plausibility_bounds"
    note: "Routes to bounding inequalities when header method text is missing or unverified"
    rules:
      - "ldl < total_cholesterol"
      - "hdl < total_cholesterol"
      - "total_cholesterol > 0.0"

hierarchical_search:
  k1_max_edit_distance: 2
  k2_discrete_candidate_limit: 15
  cost_model:
    confidence_weight: 0.50
    decimal_shift_bonus: 0.30
    transposition_bonus: 0.25
    k2_pair_bonus: 0.50